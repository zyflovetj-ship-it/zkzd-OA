server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 安全头（与后端 middleware.SECURITY_HEADERS 保持一致）。
    # ⚠️ nginx 语义：某一层级一旦出现 add_header，就**不再继承**上一层的 add_header。
    #    因此下面 location /assets/ 里必须重复声明这三个头，否则静态资源会丢掉它们。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # 静态资源长缓存（Vite 产物带 contenthash，可安全长缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 因本层已有 add_header，安全头需重复声明（原因见上）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # SPA 路由回退：刷新 /workflows/monitor 等非根路径时不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------
    # 可选：同源部署（前端代理 /api 到后端，从而彻底免掉 CORS）。
    # 启用条件：构建时令 VITE_API_BASE 为空字符串，使前端请求走相对路径 /api/*。
    # 注意：SSE（/api/events/stream）必须关闭代理缓冲并保持 HTTP/1.1 长连接，
    #       否则实时推送会被 Nginx 缓存住，表现为「事件迟迟不到」。
    # ------------------------------------------------------------------
    # location /api/ {
    #     proxy_pass http://backend:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    #     proxy_buffering off;
    #     proxy_cache off;
    #     proxy_read_timeout 3600s;
    # }
}
