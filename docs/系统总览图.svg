<svg viewBox="0 0 680 624" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>zk-oa 系统总览（功能流程 + 部署架构）</title>
  <desc>左列功能流程（角色→认证→业务模块→聚合→公共能力），右列 Web 架构（浏览器→Nginx→API 网关→应用三层→SSE），底部共享数据底座；应用层实现业务模块，SSE 实时推送回浏览器。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
      .th { font-size: 16px; font-weight: 700; }
      .ts { font-size: 12px; font-weight: 600; }
      .bt { font-size: 15px; font-weight: 700; }
      .bs { font-size: 11.5px; font-weight: 500; }
    </style>
  </defs>

  <text class="th" x="40" y="34" fill="#0C447C">中科智电 OA · 系统总览（功能流程 + 部署架构）</text>
  <text class="ts" x="640" y="34" text-anchor="end" fill="#185FA5">左：功能流程 · 右：Web 架构</text>

  <!-- ===== 左列：功能流程 ===== -->
  <g class="node c-blue" fill="#E6F1FB" stroke="#185FA5">
    <rect x="40" y="60" width="104" height="46" rx="9" stroke-width="0.6"/>
    <text class="bt" x="92" y="87" text-anchor="middle" dominant-baseline="central" fill="#0C447C">管理员</text>
  </g>
  <g class="node c-blue" fill="#E6F1FB" stroke="#185FA5">
    <rect x="158" y="60" width="104" height="46" rx="9" stroke-width="0.6"/>
    <text class="bt" x="210" y="87" text-anchor="middle" dominant-baseline="central" fill="#0C447C">部门经理</text>
  </g>
  <g class="node c-blue" fill="#E6F1FB" stroke="#185FA5">
    <rect x="276" y="60" width="104" height="46" rx="9" stroke-width="0.6"/>
    <text class="bt" x="328" y="87" text-anchor="middle" dominant-baseline="central" fill="#0C447C">普通员工</text>
  </g>
  <path class="arr" d="M210,106 L210,124" stroke="#185FA5" stroke-width="1.4" marker-end="url(#arrow)"/>

  <g class="node c-blue" fill="#E6F1FB" stroke="#185FA5">
    <rect x="40" y="126" width="340" height="64" rx="12" stroke-width="0.6"/>
    <text class="bt" x="210" y="150" text-anchor="middle" dominant-baseline="central" fill="#0C447C">统一认证与权限网关</text>
    <text class="ts" x="210" y="172" text-anchor="middle" dominant-baseline="central" fill="#185FA5">JWT 双令牌 · RBAC 角色权限</text>
  </g>
  <path class="arr" d="M210,190 L210,210" stroke="#185FA5" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="40" y="212" width="340" height="84" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text class="ts" x="50" y="230" fill="#185FA5">核心业务域</text>
  <g class="node c-blue" fill="#FFFFFF" stroke="#185FA5">
    <rect x="40" y="240" width="60" height="40" rx="9" stroke-width="0.6"/>
    <text class="bs" x="70" y="260" text-anchor="middle" dominant-baseline="central" fill="#0C447C">组织管理</text>
  </g>
  <g class="node c-blue" fill="#FFFFFF" stroke="#185FA5">
    <rect x="110" y="240" width="60" height="40" rx="9" stroke-width="0.6"/>
    <text class="bs" x="140" y="260" text-anchor="middle" dominant-baseline="central" fill="#0C447C">请假审批</text>
  </g>
  <g class="node c-blue" fill="#FFFFFF" stroke="#185FA5">
    <rect x="180" y="240" width="60" height="40" rx="9" stroke-width="0.6"/>
    <text class="bs" x="210" y="260" text-anchor="middle" dominant-baseline="central" fill="#0C447C">审批工作流</text>
  </g>
  <g class="node c-blue" fill="#FFFFFF" stroke="#185FA5">
    <rect x="250" y="240" width="60" height="40" rx="9" stroke-width="0.6"/>
    <text class="bs" x="280" y="260" text-anchor="middle" dominant-baseline="central" fill="#0C447C">公告文档</text>
  </g>
  <g class="node c-blue" fill="#FFFFFF" stroke="#185FA5">
    <rect x="320" y="240" width="60" height="40" rx="9" stroke-width="0.6"/>
    <text class="bs" x="350" y="260" text-anchor="middle" dominant-baseline="central" fill="#0C447C">电子签单</text>
  </g>
  <path class="arr" d="M210,296 L210,316" stroke="#185FA5" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="40" y="318" width="340" height="76" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text class="ts" x="50" y="336" fill="#185FA5">聚合与运营域</text>
  <g class="node c-blue" fill="#FFFFFF" stroke="#185FA5">
    <rect x="40" y="348" width="76" height="36" rx="9" stroke-width="0.6"/>
    <text class="bs" x="78" y="366" text-anchor="middle" dominant-baseline="central" fill="#0C447C">内容门户</text>
  </g>
  <g class="node c-blue" fill="#FFFFFF" stroke="#185FA5">
    <rect x="128" y="348" width="76" height="36" rx="9" stroke-width="0.6"/>
    <text class="bs" x="166" y="366" text-anchor="middle" dominant-baseline="central" fill="#0C447C">报表中心</text>
  </g>
  <g class="node c-blue" fill="#FFFFFF" stroke="#185FA5">
    <rect x="216" y="348" width="76" height="36" rx="9" stroke-width="0.6"/>
    <text class="bs" x="254" y="366" text-anchor="middle" dominant-baseline="central" fill="#0C447C">建模引擎</text>
  </g>
  <g class="node c-blue" fill="#FFFFFF" stroke="#185FA5">
    <rect x="304" y="348" width="76" height="36" rx="9" stroke-width="0.6"/>
    <text class="bs" x="342" y="366" text-anchor="middle" dominant-baseline="central" fill="#0C447C">运维中心</text>
  </g>
  <path class="arr" d="M210,394 L210,414" stroke="#185FA5" stroke-width="1.4" marker-end="url(#arrow)"/>

  <g class="node c-blue" fill="#E6F1FB" stroke="#185FA5">
    <rect x="40" y="416" width="104" height="50" rx="9" stroke-width="0.6"/>
    <text class="bt" x="92" y="441" text-anchor="middle" dominant-baseline="central" fill="#0C447C">通知中心</text>
  </g>
  <g class="node c-teal" fill="#E1F5EE" stroke="#0F6E56">
    <rect x="158" y="416" width="104" height="50" rx="9" stroke-width="0.6"/>
    <text class="bt" x="210" y="441" text-anchor="middle" dominant-baseline="central" fill="#085041">实时推送</text>
  </g>
  <g class="node c-blue" fill="#E6F1FB" stroke="#185FA5">
    <rect x="276" y="416" width="104" height="50" rx="9" stroke-width="0.6"/>
    <text class="bt" x="328" y="441" text-anchor="middle" dominant-baseline="central" fill="#0C447C">审计日志</text>
  </g>
  <path class="arr" d="M210,466 L210,514" stroke="#185FA5" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ===== 右列：Web 架构 ===== -->
  <g class="node c-blue" fill="#FFFFFF" stroke="#185FA5">
    <rect x="420" y="60" width="220" height="64" rx="12" stroke-width="0.6"/>
    <text class="bt" x="530" y="84" text-anchor="middle" dominant-baseline="central" fill="#0C447C">React 19 + AntD 5</text>
    <text class="ts" x="530" y="106" text-anchor="middle" dominant-baseline="central" fill="#185FA5">TanStack Query + axios</text>
  </g>
  <path class="arr" d="M530,124 L530,144" stroke="#185FA5" stroke-width="1.4" marker-end="url(#arrow)"/>
  <g class="node c-blue" fill="#FFFFFF" stroke="#185FA5">
    <rect x="420" y="146" width="220" height="54" rx="12" stroke-width="0.6"/>
    <text class="bt" x="530" y="173" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Nginx 托管 + /api 反代</text>
  </g>
  <path class="arr" d="M530,200 L530,220" stroke="#185FA5" stroke-width="1.4" marker-end="url(#arrow)"/>
  <g class="node c-blue" fill="#FFFFFF" stroke="#185FA5">
    <rect x="420" y="222" width="220" height="70" rx="12" stroke-width="0.6"/>
    <text class="bt" x="530" y="244" text-anchor="middle" dominant-baseline="central" fill="#0C447C">API 网关中间件链</text>
    <text class="bs" x="530" y="264" text-anchor="middle" dominant-baseline="central" fill="#185FA5">CORS·认证·审计·限流</text>
    <text class="bs" x="530" y="282" text-anchor="middle" dominant-baseline="central" fill="#185FA5">上下文·安全头·优雅停机</text>
  </g>
  <path class="arr" d="M530,292 L530,312" stroke="#185FA5" stroke-width="1.4" marker-end="url(#arrow)"/>
  <g class="node c-blue" fill="#FFFFFF" stroke="#185FA5">
    <rect x="420" y="314" width="220" height="68" rx="12" stroke-width="0.6"/>
    <text class="bt" x="530" y="336" text-anchor="middle" dominant-baseline="central" fill="#0C447C">应用三层</text>
    <text class="bs" x="530" y="356" text-anchor="middle" dominant-baseline="central" fill="#185FA5">路由(RBAC)→服务(事务)</text>
    <text class="bs" x="530" y="372" text-anchor="middle" dominant-baseline="central" fill="#185FA5">→仓储(防N+1)</text>
  </g>
  <path class="arr" d="M530,382 L530,396" stroke="#185FA5" stroke-width="1.4" marker-end="url(#arrow)"/>
  <g class="node c-teal" fill="#E1F5EE" stroke="#0F6E56">
    <rect x="420" y="398" width="220" height="58" rx="12" stroke-width="0.6"/>
    <text class="bt" x="530" y="422" text-anchor="middle" dominant-baseline="central" fill="#085041">SSE 实时通道</text>
    <text class="bs" x="530" y="444" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">EventBus 每用户队列·心跳25s</text>
  </g>
  <path class="arr" d="M530,456 L530,514" stroke="#185FA5" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 应用层实现业务模块 -->
  <path class="arr" d="M420,345 L380,345" stroke="#185FA5" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text class="ts" x="400" y="338" text-anchor="middle" fill="#185FA5">实现</text>

  <!-- SSE 推送回浏览器 -->
  <path class="arr" d="M420,427 L404,427 L404,92 L416,92" stroke="#0F6E56" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>
  <text class="ts" x="380" y="504" text-anchor="end" fill="#0F6E56">SSE 实时推送至浏览器</text>

  <!-- ===== 底部：数据底座（浅底深字，已修复可读性）===== -->
  <g>
    <rect x="40" y="516" width="600" height="88" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
    <text class="bt" x="340" y="544" text-anchor="middle" dominant-baseline="central" fill="#0C447C">数据底座</text>
    <text class="ts" x="340" y="568" text-anchor="middle" dominant-baseline="central" fill="#185FA5">PostgreSQL(生产) / SQLite(开发)</text>
    <text class="ts" x="340" y="590" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Alembic 迁移 · uploads(local/S3) · refresh_tokens 表</text>
  </g>
</svg>
